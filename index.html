body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#fff;color:#222}
.logo{background:#fff;text-align:center;padding:0;overflow:hidden}.logo img{display:block;width:auto;max-width:100%;height:auto;max-height:38vh;object-fit:contain;margin:0 auto}
@media(max-width:600px){.logo img{max-height:34vh}}
.banner{background:#1f3864;color:#fff;text-align:center;font-size:24px;font-weight:bold;padding:14px}
.sub{text-align:center;color:#555;font-size:14px;padding:8px}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px}
.bar b{font-size:18px}
#q{background:#ffff00;border:1px solid #999;font-size:18px;padding:8px 12px;width:min(340px,70vw);font-family:inherit}
#cnt{text-align:center;color:#555;font-size:13px;padding-bottom:6px}
table{border-collapse:collapse;width:96%;max-width:1000px;margin:0 auto 30px}
th{background:#1f4e78;color:#fff;padding:8px;font-size:15px}
td{padding:4px 8px;font-size:13px;border-bottom:1px solid #fff;text-align:center}
tbody tr:nth-child(odd) td{background:#dce6f1}tbody tr:nth-child(even) td{background:#fff}
tr.grp td{background:#1f4e78!important;color:#fff;font-weight:bold;font-size:14px;text-align:left}
td.d{text-align:right;direction:rtl}td.l{direction:ltr}.tab,#cl{direction:ltr}
.none{text-align:center;padding:30px;color:#a00;font-size:16px}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;background:#e9edf4;padding:6px 6px 0;margin:0 0 10px;border-bottom:3px solid #1f3864;position:sticky;top:0;z-index:5}
.tab{flex:0 0 auto;background:#7f8fa9;color:#fff;border:0;padding:10px 16px;font-size:15px;font-family:inherit;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tab.on{background:#1f3864;font-weight:bold}
tr.sr{cursor:pointer}.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.mo.on{display:flex}
.card{background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:88vh;overflow:auto;padding:16px;text-align:center;direction:rtl;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card img{max-width:70%;max-height:220px;object-fit:contain;display:block;margin:6px auto 10px}.card h3{margin:6px 0;color:#1f3864;font-size:19px}.card .of{direction:ltr;color:#555;font-size:13px;margin-bottom:8px}
.card p{font-size:16px;line-height:1.7;margin:8px 0;text-align:right}.card .nt{font-size:12px;color:#777}.card .x{position:absolute;top:6px;left:10px;border:0;background:none;font-size:28px;cursor:pointer;color:#555}
.card .nn{color:#777;font-size:14px}tr.of{cursor:pointer}.pl{text-align:right;margin-top:10px;border-top:1px solid #ddd}.pg{background:#1f4e78;color:#fff;font-size:13px;padding:4px 8px;margin:10px 0 0;border-radius:4px;text-align:right}
.pi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee}.pi img{width:64px;height:64px;object-fit:contain;flex:0 0 64px;margin:0;max-width:64px;max-height:64px}
.pi .pt{flex:1;font-size:14px;line-height:1.5}.pi b{direction:ltr;display:block;text-align:left;color:#1f3864;font-size:14px}.pi .kd{display:inline-block;background:#dce6f1;border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 0}
.pi .en{color:#555;font-size:13px}.pi .us{color:#222}.card .sc{font-size:11px;color:#888;margin-top:6px}
